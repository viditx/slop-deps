name: 'slop-deps'
description: 'Zero-dependency sentinel against slopsquatting — catches AI-hallucinated and typosquatted dependencies before they reach your lockfile.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  directory:
    description: 'Directory to scan'
    required: false
    default: '.'
  strict:
    description: 'Exit with code 2 on suspicious or unresolved findings (fail the job)'
    required: false
    default: 'true'
  sarif:
    description: 'Emit slop-deps.sarif and upload it as an artifact for GitHub code scanning'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Run slop-deps scan
      shell: bash
      env:
        SLOP_DEPS_DIRECTORY: ${{ inputs.directory }}
        SLOP_DEPS_STRICT: ${{ inputs.strict }}
        SLOP_DEPS_SARIF: ${{ inputs.sarif }}
      run: |
        set -- npx --yes slop-deps@1.4.0 --dir "$SLOP_DEPS_DIRECTORY"
        if [ "$SLOP_DEPS_STRICT" = "true" ]; then
          set -- "$@" --strict
        fi
        if [ "$SLOP_DEPS_SARIF" = "true" ]; then
          "$@" --sarif > slop-deps.sarif
        else
          "$@"
        fi

    - name: Upload SARIF artifact
      if: ${{ inputs.sarif == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: slop-deps-sarif
        path: slop-deps.sarif
