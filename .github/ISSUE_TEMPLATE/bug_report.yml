name: Bug report
description: Report a reproducible problem with slop-deps.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets and private source code before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which slop-deps version are you using?
      placeholder: 1.0.0-alpha
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, minimal fixture, and actual output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
