name: Supply Chain Sentinel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Automated Tests & Self Dogfooding
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: '20'

      - name: Verify zero runtime dependencies invariant
        run: |
          node -e '
            const pkg = JSON.parse(require("fs").readFileSync("package.json", "utf-8"));
            const deps = Object.keys(pkg.dependencies || {});
            const optDeps = Object.keys(pkg.optionalDependencies || {});
            if (deps.length > 0 || optDeps.length > 0) {
              console.error("VIOLATION: package.json must have 0 runtime dependencies! Found:", deps, optDeps);
              process.exit(1);
            }
            console.log("✔ Zero-dependency invariant verified: dependencies & optionalDependencies are empty");
          '

      - name: Install site dependencies for integration tests
        run: npm ci --prefix site/morpho

      - name: Run test suite
        run: npm test

      - name: Dogfood slop-deps on src/
        run: node bin/slop-deps.js --dir src
