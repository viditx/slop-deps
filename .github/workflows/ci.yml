name: Supply Chain Sentinel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  slop-check:
    name: Scan for Hallucinated Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run slop-deps on source
        run: node bin/slop-deps.js --dir .
