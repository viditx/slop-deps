<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>slop-deps // dependency firewall</title>
<style>
  :root {
    --bg: #08090C;
    --card: #0E1016;
    --panel: #13161F;
    --border: rgba(245, 244, 240, 0.09);
    --border-hi: rgba(245, 244, 240, 0.22);
    --ink: #F5F4F0;
    --ink-dim: #8B8FA3;
    --ginger: #FF5A26;
    --cyan: #00F5D4;
    --emerald: #10B981;
    --crimson: #FF2A6D;
    --amber: #FFB224;
    --mono: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--mono); font-size: 14px; min-height: 100vh;
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 90, 38, 0.08), transparent);
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .logo { font-weight: 700; font-size: 22px; letter-spacing: -0.5px; }
  .logo b { color: var(--ginger); }
  .tag { color: var(--ink-dim); font-size: 12px; }
  .ver { color: var(--cyan); font-size: 11px; border: 1px solid rgba(0, 245, 212, .3); padding: 2px 8px; border-radius: 10px; }
  .scanbar { display: flex; gap: 10px; margin: 22px 0; }
  .scanbar input {
    flex: 1; background: var(--card); border: 1px solid var(--border-hi); color: var(--ink);
    font-family: var(--mono); font-size: 13px; padding: 11px 14px; border-radius: 8px; outline: none;
    transition: border-color .15s;
  }
  .scanbar input:focus { border-color: var(--ginger); }
  .btn {
    background: var(--ginger); color: #140A05; border: none; font-family: var(--mono);
    font-weight: 700; font-size: 13px; padding: 11px 22px; border-radius: 8px; cursor: pointer;
    transition: transform .1s, box-shadow .15s;
  }
  .btn:hover { box-shadow: 0 0 24px rgba(255, 90, 38, 0.4); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--ink-dim); border: 1px solid var(--border-hi); }
  .btn.ghost:hover { box-shadow: none; color: var(--ink); border-color: var(--ink-dim); }
  .btn:disabled { opacity: .45; cursor: wait; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 22px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 10px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .stat.total .n { color: var(--ink); }
  .stat.crit .n { color: var(--crimson); }
  .stat.susp .n { color: var(--amber); }
  .stat.warn .n { color: var(--cyan); }
  .stat.clean .n { color: var(--emerald); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-dim); padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255, 255, 255, 0.015); }
  .pkg { font-weight: 700; }
  .eco { color: var(--ink-dim); font-size: 11px; }
  .chip { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 3px 9px; border-radius: 10px; }
  .chip.CRITICAL { background: rgba(255, 42, 109, .15); color: var(--crimson); border: 1px solid rgba(255, 42, 109, .4); }
  .chip.HIGH { background: rgba(255, 178, 36, .12); color: var(--amber); border: 1px solid rgba(255, 178, 36, .35); }
  .chip.WARN { background: rgba(0, 245, 212, .1); color: var(--cyan); border: 1px solid rgba(0, 245, 212, .3); }
  .chip.CLEAN { background: rgba(16, 185, 129, .12); color: var(--emerald); border: 1px solid rgba(16, 185, 129, .35); }
  .msg { color: var(--ink-dim); font-size: 12px; line-height: 1.45; }
  .loc { color: var(--ink-dim); font-size: 11px; white-space: nowrap; }
  .status { text-align: center; padding: 40px; color: var(--ink-dim); font-size: 13px; }
  .status.err { color: var(--crimson); }
  .pulse { display: inline-block; animation: blink 1.2s infinite; color: var(--ginger); }
  @keyframes blink { 50% { opacity: .25; } }
  footer { margin-top: 26px; color: var(--ink-dim); font-size: 11px; display: flex; gap: 18px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-dim); }
  .empty .big { font-size: 30px; margin-bottom: 8px; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } .hide-sm { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">slop<b>-</b>deps</div>
    <div class="tag">AI dependency firewall — hallucination &amp; typosquat sentinel</div>
    <div class="ver">v1.4.0</div>
  </header>

  <div class="scanbar">
    <input id="dir" placeholder="/path/to/project (empty = server root)" spellcheck="false" />
    <button class="btn" id="run">SCAN</button>
    <button class="btn ghost" id="sarif" title="Download last scan as SARIF 2.1.0" disabled>SARIF</button>
  </div>

  <div class="stats" id="stats" style="display:none">
    <div class="stat total"><div class="n" id="s-total">0</div><div class="l">inspected</div></div>
    <div class="stat crit"><div class="n" id="s-crit">0</div><div class="l">hallucinated</div></div>
    <div class="stat susp"><div class="n" id="s-susp">0</div><div class="l">suspicious</div></div>
    <div class="stat warn"><div class="n" id="s-warn">0</div><div class="l">unresolved</div></div>
    <div class="stat clean"><div class="n" id="s-clean">0</div><div class="l">verified</div></div>
  </div>

  <div id="content"><div class="status" id="idle">enter a directory and hit <span class="pulse">SCAN</span></div></div>

  <footer>
    <span>zero dependencies</span>
    <span>localhost only — nothing leaves your machine except registry lookups</span>
    <span>GET /api/scan?dir=&amp;format=sarif</span>
  </footer>
</div>

<script>
'use strict';
const RISK_ORDER = { CRITICAL: 0, HIGH: 1, WARN: 2, CLEAN: 3 };
let lastFindings = null;
let scanningNow = false;

async function runScan(format) {
  if (scanningNow) return;
  scanningNow = true;
  document.getElementById('run').disabled = true;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="status">scanning <span class="pulse">...</span></div>';
  const dir = document.getElementById('dir').value.trim();
  try {
    const res = await fetch('/api/scan?' + new URLSearchParams({ dir, ...(format === 'sarif' ? { format } : {}) }));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    if (format === 'sarif') {
      const blob = new Blob([JSON.stringify(data.sarif, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'slop-deps.sarif';
      a.click();
      URL.revokeObjectURL(a.href);
      return;
    }
    lastFindings = data.findings;
    render(data);
    document.getElementById('sarif').disabled = false;
  } catch (err) {
    content.innerHTML = '<div class="status err">' + err.message.replace(/</g, '&lt;') + '</div>';
  } finally {
    scanningNow = false;
    document.getElementById('run').disabled = false;
  }
}

function render(data) {
  const s = data.stats;
  const stats = document.getElementById('stats');
  stats.style.display = '';
  document.getElementById('s-total').textContent = s.total;
  document.getElementById('s-crit').textContent = s.critical;
  document.getElementById('s-susp').textContent = s.suspicious;
  document.getElementById('s-warn').textContent = s.warn;
  document.getElementById('s-clean').textContent = s.clean;

  const content = document.getElementById('content');
  if (!data.findings.length) {
    content.innerHTML = '<div class="empty"><div class="big">✔</div>no foreign dependencies detected</div>';
    return;
  }
  const rows = [...data.findings].sort((a, b) => RISK_ORDER[a.risk] - RISK_ORDER[b.risk]).map(f => `
    <tr>
      <td><span class="pkg">${escapeHtml(f.name)}</span><div class="eco">${f.ecosystem}${f.resolvedDist && f.resolvedDist.toLowerCase() !== f.name.toLowerCase() ? ' → ' + escapeHtml(f.resolvedDist) : ''}</div></td>
      <td><span class="chip ${f.risk}">${f.risk}</span></td>
      <td class="hide-sm">${escapeHtml(f.status || '')}</td>
      <td><div class="msg">${escapeHtml(f.message || '')}${f.hasInstallScripts ? ' · <span style="color:var(--amber)">install scripts</span>' : ''}</div></td>
      <td class="loc">${escapeHtml(f.file || '')}${f.line ? ':' + f.line : ''}</td>
    </tr>`).join('');
  content.innerHTML = `
    <table>
      <thead><tr><th>package</th><th>risk</th><th class="hide-sm">status</th><th style="width:40%">detail</th><th>location</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.getElementById('run').addEventListener('click', () => runScan());
document.getElementById('sarif').addEventListener('click', () => runScan('sarif'));
document.getElementById('dir').addEventListener('keydown', e => { if (e.key === 'Enter') runScan(); });
</script>
</body>
</html>
