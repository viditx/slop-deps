<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLW-01 // FELINE FILE PROCESSOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-oled: #08090C;
      --bg-card: #0E1016;
      --bg-panel: #13161F;
      --border-dim: rgba(245, 244, 240, 0.08);
      --border-bright: rgba(245, 244, 240, 0.22);
      --cream: #F5F4F0;
      --cream-shadow: #DFDDD4;
      --cream-deep: #C5C2B6;
      --ginger: #FF5A26;
      --ginger-glow: rgba(255, 90, 38, 0.35);
      --lavender: #9D8DF1;
      --obsidian: #181A24;
      --obsidian-light: #25293A;
      --cyan: #00F5D4;
      --emerald: #10B981;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --snappy: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-oled);
      color: var(--cream);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 35%, rgba(157, 141, 241, 0.06) 0%, transparent 60%),
        radial-gradient(rgba(245, 244, 240, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px;
    }

    /* Hardware Frame / Dropzone Container */
    .stage-chassis {
      position: relative;
      width: 580px;
      max-width: 94vw;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 
        0 30px 70px -15px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
      transition: border-color 0.35s var(--snappy), transform 0.35s var(--spring), box-shadow 0.35s var(--snappy);
    }

    .stage-chassis.drag-active {
      border-color: var(--cyan);
      box-shadow: 
        0 30px 80px -10px rgba(0, 245, 212, 0.16),
        inset 0 0 28px rgba(0, 245, 212, 0.05);
      transform: scale(1.015);
    }

    /* Chassis Shake on Claw Slash */
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-12px, -6px) rotate(-1.2deg); }
      30% { transform: translate(10px, 8px) rotate(1.2deg); }
      45% { transform: translate(-8px, 4px) rotate(-0.8deg); }
      60% { transform: translate(8px, -4px) rotate(0.6deg); }
      75% { transform: translate(-4px, 2px) rotate(-0.3deg); }
    }

    .stage-chassis.shake {
      animation: screenShake 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Top Telemetry Bar (Teenage Engineering vibe) */
    .telemetry-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(245, 244, 240, 0.55);
      text-transform: uppercase;
    }

    .telemetry-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .stage-chassis[data-state="drag"] .status-led {
      background: var(--ginger);
      box-shadow: 0 0 12px var(--ginger);
    }

    .stage-chassis[data-state="hack"] .status-led {
      background: #FF2A6D;
      box-shadow: 0 0 14px #FF2A6D;
      animation: ledBlink 0.12s infinite alternate;
    }

    @keyframes ledBlink {
      from { opacity: 1; }
      to { opacity: 0.25; }
    }

    .audio-toggle {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      color: var(--cream);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .audio-toggle:hover {
      border-color: var(--border-bright);
    }

    .audio-toggle.muted {
      opacity: 0.45;
    }

    /* Main SVG Viewport */
    .mascot-viewport {
      position: relative;
      width: 100%;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 18px;
      background: radial-gradient(circle at 50% 68%, rgba(25, 29, 44, 0.8) 0%, rgba(10, 12, 18, 0.4) 75%);
      margin: 16px 0;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    /* Dropzone Corner Crosshairs */
    .crosshair {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: rgba(245, 244, 240, 0.22);
      border-style: solid;
      pointer-events: none;
      transition: all 0.3s var(--spring);
    }
    .ch-tl { top: 12px; left: 12px; border-width: 1.5px 0 0 1.5px; }
    .ch-tr { top: 12px; right: 12px; border-width: 1.5px 1.5px 0 0; }
    .ch-bl { bottom: 12px; left: 12px; border-width: 0 0 1.5px 1.5px; }
    .ch-br { bottom: 12px; right: 12px; border-width: 0 1.5px 1.5px 0; }

    .stage-chassis[data-state="drag"] .crosshair {
      width: 20px;
      height: 20px;
      border-color: var(--cyan);
    }

    svg#cat-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* =====================================================
       SVG CHOREOGRAPHY & STATE TRANSITIONS
       ===================================================== */

    /* 1. Rhythmic Tail Spring Animation */
    #cat-tail {
      transform-origin: 362px 262px;
      animation: tailSway 3.4s ease-in-out infinite alternate;
    }

    .stage-chassis[data-state="drag"] #cat-tail {
      animation: tailSwayFast 0.65s ease-in-out infinite alternate;
    }

    .stage-chassis[data-state="hack"] #cat-tail {
      animation: tailSwayFast 0.22s ease-in-out infinite alternate;
    }

    @keyframes tailSway {
      0% { transform: rotate(-7deg); }
      100% { transform: rotate(9deg); }
    }

    @keyframes tailSwayFast {
      0% { transform: rotate(-14deg); }
      100% { transform: rotate(16deg); }
    }

    /* 2. Head & Body Breathing + State Posture */
    #cat-head, #cat-torso, #ear-left, #ear-right, #pupil-left-shape, #pupil-right-shape {
      transition: transform 0.5s var(--spring);
    }

    #cat-head {
      transform-origin: 250px 180px;
      animation: headBob 4s ease-in-out infinite;
    }

    @keyframes headBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(2.5px); }
    }

    /* DRAG HOVER STATE: Ears perk up, eyes dilate wide, head leans in */
    #ear-left { transform-origin: 205px 128px; }
    #ear-right { transform-origin: 295px 128px; }

    .stage-chassis[data-state="drag"] #ear-left {
      transform: rotate(9deg) translateY(-6px) scale(1.06);
    }
    .stage-chassis[data-state="drag"] #ear-right {
      transform: rotate(-9deg) translateY(-6px) scale(1.06);
    }
    .stage-chassis[data-state="drag"] #cat-head {
      animation: none;
      transform: translateY(-7px) scale(1.04);
    }

    /* Pupil Dilation */
    #pupil-left-shape, #pupil-right-shape {
      transform-origin: center;
      transform-box: fill-box;
    }
    .stage-chassis[data-state="drag"] #pupil-left-shape,
    .stage-chassis[data-state="drag"] #pupil-right-shape {
      transform: scale(1.28);
    }
    .stage-chassis[data-state="hack"] #pupil-left-shape,
    .stage-chassis[data-state="hack"] #pupil-right-shape {
      transform: scale(0.82);
    }

    /* Eyelids (Blinking & Chill State) */
    .eyelid {
      transform-origin: center top;
      transform-box: fill-box;
      transform: scaleY(0);
      transition: transform 0.14s ease-in-out;
    }

    .eyelid.blink-now {
      transform: scaleY(1.05);
    }

    /* Chill / Reading State: Half-closed relaxed zen eyes */
    .stage-chassis[data-state="chill"] .eyelid {
      transform: scaleY(0.58);
      transition: transform 0.6s var(--snappy);
    }
    .stage-chassis[data-state="chill"] .eyelid.blink-now {
      transform: scaleY(1.05);
    }

    /* 3. Paws Choreography */
    #paw-left, #paw-right {
      transition: transform 0.45s var(--spring), opacity 0.25s ease;
      transform-origin: center;
      transform-box: fill-box;
    }

    /* DRAG HOVER: Paws reach further forward in anticipation */
    .stage-chassis[data-state="drag"] #paw-left {
      transform: translate(-10px, 16px) scale(1.14) rotate(8deg);
    }
    .stage-chassis[data-state="drag"] #paw-right {
      transform: translate(10px, 16px) scale(1.14) rotate(-8deg);
    }
    .stage-chassis[data-state="drag"] .paw-claws {
      opacity: 1;
      transform: translateY(3px);
    }

    .paw-claws {
      opacity: 0;
      transition: all 0.25s var(--spring);
    }

    /* HACK STATE: Hyper-speed mechanical keyboard drumming */
    .stage-chassis[data-state="hack"] #paw-left {
      animation: drumLeft 0.085s infinite alternate ease-in-out;
    }
    .stage-chassis[data-state="hack"] #paw-right {
      animation: drumRight 0.085s infinite alternate-reverse ease-in-out;
    }

    @keyframes drumLeft {
      0% { transform: translate(8px, -16px) rotate(-10deg) scale(0.95); }
      100% { transform: translate(12px, 5px) rotate(6deg) scale(1.04); }
    }
    @keyframes drumRight {
      0% { transform: translate(-8px, -16px) rotate(10deg) scale(0.95); }
      100% { transform: translate(-12px, 5px) rotate(-6deg) scale(1.04); }
    }

    /* REPORT STATE: Right paw slides the envelope forward */
    .stage-chassis[data-state="report"] #paw-left {
      transform: translate(-18px, -6px) rotate(12deg);
    }
    .stage-chassis[data-state="report"] #paw-right {
      transform: translate(-16px, 14px) rotate(-14deg) scale(1.06);
    }

    /* CHILL STATE: Hide resting paws, show dual paws gripping coffee mug */
    .stage-chassis[data-state="chill"] #paw-left,
    .stage-chassis[data-state="chill"] #paw-right {
      opacity: 0;
      transform: translate(0, -15px) scale(0.7);
      pointer-events: none;
    }

    /* 4. Props: Mechanical Keyboard, Report Envelope, Steaming Coffee Mug */
    #prop-keyboard {
      opacity: 0;
      transform: translateY(35px) scale(0.85);
      transform-origin: 250px 295px;
      transition: all 0.38s var(--spring);
      pointer-events: none;
    }
    .stage-chassis[data-state="hack"] #prop-keyboard {
      opacity: 1;
      transform: translateY(0px) scale(1);
    }

    /* Code Matrix Particles during Hack */
    .hack-particle {
      opacity: 0;
    }
    .stage-chassis[data-state="hack"] .hack-particle {
      animation: floatBit 0.55s linear infinite;
    }
    .stage-chassis[data-state="hack"] .hp-2 { animation-delay: 0.18s; }
    .stage-chassis[data-state="hack"] .hp-3 { animation-delay: 0.35s; }

    @keyframes floatBit {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-42px) scale(1.15); }
    }

    /* Report Envelope Prop */
    #prop-envelope {
      opacity: 0;
      transform: translateY(-25px) scale(0.6) rotate(-8deg);
      transform-origin: 250px 295px;
      transition: all 0.6s var(--spring);
      pointer-events: none;
    }
    .stage-chassis[data-state="report"] #prop-envelope {
      opacity: 1;
      transform: translateY(8px) scale(1.06) rotate(-2deg);
      pointer-events: auto;
      cursor: pointer;
    }
    .stage-chassis[data-state="report"] #prop-envelope:hover {
      transform: translateY(4px) scale(1.11) rotate(0deg);
    }

    /* Coffee Mug Prop (Chill State) */
    #prop-coffee {
      opacity: 0;
      transform: translateY(40px) scale(0.8);
      transform-origin: 250px 265px;
      transition: all 0.55s var(--spring);
      pointer-events: none;
    }
    .stage-chassis[data-state="chill"] #prop-coffee {
      opacity: 1;
      transform: translateY(0px) scale(1);
      animation: sipMotion 5s ease-in-out infinite;
    }

    @keyframes sipMotion {
      0%, 20%, 80%, 100% { transform: translateY(0px) rotate(0deg); }
      45%, 58% { transform: translateY(-24px) rotate(-7deg) scale(1.03); }
    }

    .steam-wisp {
      opacity: 0;
      stroke-dasharray: 28;
      stroke-dashoffset: 28;
    }
    .stage-chassis[data-state="chill"] .steam-wisp {
      animation: steamRise 2.6s ease-in-out infinite;
    }
    .stage-chassis[data-state="chill"] .sw-2 { animation-delay: 0.85s; }
    .stage-chassis[data-state="chill"] .sw-3 { animation-delay: 1.7s; }

    @keyframes steamRise {
      0% { opacity: 0; stroke-dashoffset: 28; transform: translateY(4px); }
      40% { opacity: 0.75; }
      100% { opacity: 0; stroke-dashoffset: 0; transform: translateY(-24px); }
    }

    /* 5. THE UNHINGED CLAW SCRATCH OVERLAY */
    #claw-slash-layer {
      pointer-events: none;
      opacity: 0;
    }
    #claw-slash-layer.active {
      opacity: 1;
    }

    .slash-line {
      stroke-dasharray: 700;
      stroke-dashoffset: 700;
    }
    #claw-slash-layer.active .slash-line {
      animation: slashTear 0.34s cubic-bezier(0.08, 0.92, 0.18, 1) forwards;
    }
    #claw-slash-layer.active .sl-2 { animation-delay: 0.03s; }
    #claw-slash-layer.active .sl-3 { animation-delay: 0.06s; }

    @keyframes slashTear {
      0% { stroke-dashoffset: 700; opacity: 1; stroke-width: 12px; }
      45% { stroke-dashoffset: 0; opacity: 1; stroke-width: 8px; }
      100% { stroke-dashoffset: 0; opacity: 0; stroke-width: 1px; }
    }

    .slash-flash {
      opacity: 0;
    }
    #claw-slash-layer.active .slash-flash {
      animation: flashBurst 0.28s ease-out forwards;
    }
    @keyframes flashBurst {
      0% { opacity: 0.38; }
      100% { opacity: 0; }
    }

    /* =====================================================
       EDITORIAL SPEECH BUBBLE & CONTROLS
       ===================================================== */
    .speech-region {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      margin-bottom: 18px;
      min-height: 54px;
    }

    .speech-pill {
      position: relative;
      background: var(--bg-panel);
      border: 1px solid var(--border-bright);
      padding: 10px 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.35s var(--spring), border-color 0.3s;
    }

    .speech-pill::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-bright);
      border-top: 1px solid var(--border-bright);
    }

    .speech-pill.pop {
      transform: scale(1.06);
    }

    .speech-text {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 23px;
      letter-spacing: 0.02em;
      color: var(--cream);
      line-height: 1;
    }

    .speech-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(245, 244, 240, 0.42);
      margin-top: 8px;
      letter-spacing: 0.06em;
    }

    /* Tactile Hardware State Switcher Deck */
    .deck-controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border-dim);
    }

    .deck-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 10px 6px;
      color: rgba(245, 244, 240, 0.65);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.2s var(--snappy);
      position: relative;
      overflow: hidden;
    }

    .deck-btn .key-index {
      font-size: 9px;
      opacity: 0.4;
    }

    .deck-btn:hover {
      border-color: var(--border-bright);
      color: var(--cream);
      transform: translateY(-2px);
    }

    .deck-btn:active {
      transform: translateY(1px);
    }

    .deck-btn.active {
      background: rgba(245, 244, 240, 0.07);
      border-color: var(--cyan);
      color: var(--cream);
      box-shadow: inset 0 0 12px rgba(0, 245, 212, 0.12);
    }

    .deck-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 25%;
      width: 50%;
      height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    /* Hidden file input for click-to-drop convenience */
    #hidden-file-input {
      display: none;
    }

    @media (max-width: 520px) {
      .deck-controls {
        grid-template-columns: repeat(3, 1fr);
      }
      .speech-text {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

  <main class="stage-chassis" id="chassis" data-state="idle">
    <!-- Top Hardware Telemetry Bar -->
    <header class="telemetry-bar">
      <div class="telemetry-left">
        <span class="status-led" id="status-led"></span>
        <span>UNIT // FLW-CAT-01</span>
        <span id="telemetry-mode" style="color: var(--cyan);">[STATE: IDLE_TRACK]</span>
      </div>
      <button class="audio-toggle" id="audio-btn" title="Toggle Procedural Synth SFX">
        <span id="audio-icon">🔊</span>
        <span id="audio-label">SFX: ON</span>
      </button>
    </header>

    <!-- Interactive SVG Mascot Viewport -->
    <div class="mascot-viewport" id="dropzone">
      <div class="crosshair ch-tl"></div>
      <div class="crosshair ch-tr"></div>
      <div class="crosshair ch-bl"></div>
      <div class="crosshair ch-br"></div>

      <svg id="cat-svg" viewBox="0 0 500 350" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Subtle Tactile Gradients -->
          <linearGradient id="creamBodyGrad" x1="250" y1="80" x2="250" y2="310" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FAF9F5" />
            <stop offset="65%" stop-color="#F0EEE6" />
            <stop offset="100%" stop-color="#DBD7C9" />
          </linearGradient>

          <linearGradient id="gingerPatchGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FF6B3D" />
            <stop offset="100%" stop-color="#E04312" />
          </linearGradient>

          <linearGradient id="obsidianGrad" x1="250" y1="120" x2="250" y2="210" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#222536" />
            <stop offset="100%" stop-color="#10121A" />
          </linearGradient>

          <linearGradient id="pupilEmeraldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00F5D4" />
            <stop offset="100%" stop-color="#059669" />
          </linearGradient>

          <linearGradient id="lavenderCollar" x1="190" y1="210" x2="310" y2="225" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#B5A8FF" />
            <stop offset="50%" stop-color="#9D8DF1" />
            <stop offset="100%" stop-color="#7665D6" />
          </linearGradient>

          <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.7" />
            <stop offset="70%" stop-color="#000000" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
          </radialGradient>

          <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <filter id="slashGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <filter id="softDrop" x="-15%" y="-15%" width="130%" height="135%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#040507" flood-opacity="0.55" />
          </filter>

          <!-- Eye Socket Clip Paths (For clean eyelid blinks & pupil bounds) -->
          <clipPath id="leftEyeClip">
            <circle cx="212" cy="166" r="23" />
          </clipPath>
          <clipPath id="rightEyeClip">
            <circle cx="288" cy="166" r="23" />
          </clipPath>
        </defs>

        <!-- Ambient Floor Shadow -->
        <ellipse cx="250" cy="300" rx="135" ry="22" fill="url(#floorShadow)" />

        <!-- =========================================
             1. RHYTHMIC WAVING SPRING TAIL
             ========================================= -->
        <g id="cat-tail" filter="url(#softDrop)">
          <path d="M 326 266 C 378 272, 412 232, 405 184 C 400 148, 370 142, 366 168 C 362 192, 384 218, 345 244"
                stroke="url(#creamBodyGrad)" stroke-width="26" stroke-linecap="round" fill="none" />
          <!-- Burnt Ginger Tail Tip -->
          <path d="M 404 192 C 401 154, 370 144, 366 168"

  <script>
    (() => {
      // =====================================================

      // =====================================================
      const chassis = document.getElementById('chassis');

      const catSvg = document.getElementById('cat-svg');

      const propEnvelope = document.getElementById('prop-envelope');
      const fileInput = document.getElementById('hidden-file-input');

      let currentState = 'idle';
      let sequenceTimers = [];
      let hackTypeInterval = null;

      const STATE_META = {
        idle: {
          telemetry: '[STATE: IDLE_TRACK]',
          speech: 'meowww give me ur files meowww',
          sub: 'DRAG & DROP ANY FILE INTO THE VIEWPORT OR USE DECK KEYS [1-5]'

        drag: {
          telemetry: '[STATE: TARGET_LOCKED]',
          speech: 'OOOOH drop it right here meowww!! 👀',
          sub: 'RELEASE FILE TO UNLEASH CLAW PARSER'
        },
        hack: {
          telemetry: '[STATE: CLAW_PARSE // 140 WPM]',
          speech: 'thap-thap-thap-thap compiling meowww ⚡',
          sub: 'SHREDDING BYTES & EXTRACTING INSIGHTS...'
        },
        report: {
          telemetry: '[STATE: REPORT_READY]',
          speech: "Meowww! Here's ur report ✉️",
          sub: 'CLICK THE SEALED ENVELOPE TO READ WHILE CAT SIPS COFFEE'

        chill: {
          telemetry: '[STATE: ZEN_CAFFEINE]',
          speech: 'siiip... take ur time reading meowww ☕',
          sub: 'BREWING DARK ROAST ESPRESSO // IDLE MONITORING'
        }
      };

      // =====================================================
      // 2. WEB AUDIO API PROCEDURAL SOUND SYNTHESIZER
      // =====================================================
      let audioCtx = null;
      let sfxEnabled = true;
      const audioBtn = document.getElementById('audio-btn');
      const audioIcon = document.getElementById('audio-icon');
      const audioLabel = document.getElementById('audio-label');

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      audioBtn.addEventListener('click', () => {
        sfxEnabled = !sfxEnabled;
        audioBtn.classList.toggle('muted', !sfxEnabled);
        audioIcon.textContent = sfxEnabled ? '🔊' : '🔇';
        audioLabel.textContent = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
      });

      function playClawSlashSfx() {
        if (!sfxEnabled) return;
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        // White noise burst + high-Q filter sweep for dramatic tear
        const bufferSize = audioCtx.sampleRate * 0.28;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.09));
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 3.5;
        filter.frequency.setValueAtTime(2800, now);
        filter.frequency.exponentialRampToValueAtTime(320, now + 0.26);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.27);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      }

      function playKeyClickSfx() {
        if (!sfxEnabled) return;
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(900 + Math.random() * 500, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.025);

        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.03);
      }

      function playReportChimeSfx() {
        if (!sfxEnabled) return;
        initAudio();
        if (!audioCtx) return;

        const notes = [587.33, 880, 1174.66]; // D5, A5, D6
        notes.forEach((freq, idx) => {
          const now = audioCtx.currentTime + idx * 0.07;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.46);
        });
      }

      // =====================================================
      // 3. SMOOTH TRIGONOMETRIC EYE TRACKING (Math.atan2 + LERP)
      // =====================================================
      const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      const eyeState = {
        left: { curX: 0, curY: 0, targetX: 0, targetY: 0 },
        right: { curX: 0, curY: 0, targetX: 0, targetY: 0 }
      };

      window.addEventListener('pointermove', (e) => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      });

      function updateEyeTargets() {
        const rect = catSvg.getBoundingClientRect();
        if (rect.width === 0) return;

        // Convert screen pointer into SVG 500x350 coordinate space
        const svgX = ((pointer.x - rect.left) / rect.width) * 500;
        const svgY = ((pointer.y - rect.top) / rect.height) * 350;

        const eyes = [
          { key: 'left', cx: 212, cy: 166 },
          { key: 'right', cx: 288, cy: 166 }
        ];

        eyes.forEach(({ key, cx, cy }) => {
          if (currentState === 'hack') {
            // Rapidly scan across the mechanical keyboard
            const scan = Math.sin(performance.now() * 0.025) * 6;
            eyeState[key].targetX = scan;
            eyeState[key].targetY = 8;
            return;
          }

          if (currentState === 'chill') {
            // Calm relaxed downward gaze toward the coffee mug
            eyeState[key].targetX = Math.sin(performance.now() * 0.0015) * 2.5;
            eyeState[key].targetY = 5;
            return;
          }

          const dx = svgX - cx;
          const dy = svgY - cy;
          const angle = Math.atan2(dy, dx);
          const maxRadius = currentState === 'drag' ? 9.5 : 8.0;
          const distance = Math.min(maxRadius, Math.hypot(dx, dy) * 0.065);

          eyeState[key].targetX = Math.cos(angle) * distance;
          eyeState[key].targetY = Math.sin(angle) * distance;
        });
      }

      function animateEyesLoop() {
        updateEyeTargets();
        const lerpFactor = currentState === 'hack' ? 0.35 : 0.16;

        ['left', 'right'].forEach((key) => {
          const st = eyeState[key];
          st.curX += (st.targetX - st.curX) * lerpFactor;
          st.curY += (st.targetY - st.curY) * lerpFactor;
        });

        pupilLeft.setAttribute(
          'transform',
          `translate(${eyeState.left.curX.toFixed(2)}, ${eyeState.left.curY.toFixed(2)})`
        );
        pupilRight.setAttribute(
          'transform',
          `translate(${eyeState.right.curX.toFixed(2)}, ${eyeState.right.curY.toFixed(2)})`
        );

        requestAnimationFrame(animateEyesLoop);
      }
      requestAnimationFrame(animateEyesLoop);

      // Natural Autonomous Blink Loop
      function scheduleBlink() {
        const nextDelay = currentState === 'chill'
          ? 2200 + Math.random() * 1800
          : 2800 + Math.random() * 3400;

        setTimeout(() => {
          if (currentState !== 'drag' && currentState !== 'hack') {
            eyelids.forEach((el) => el.classList.add('blink-now'));
            setTimeout(() => {
              eyelids.forEach((el) => el.classList.remove('blink-now'));
            }, currentState === 'chill' ? 260 : 140);
          }
          scheduleBlink();
        }, nextDelay);
      }
      scheduleBlink();

      // =====================================================
      // 4. STATE CHOREOGRAPHY ENGINE
      // =====================================================
      function clearSequenceTimers() {
        sequenceTimers.forEach((t) => clearTimeout(t));
        sequenceTimers = [];
        if (hackTypeInterval) {
          clearInterval(hackTypeInterval);
          hackTypeInterval = null;
        }
      }

      function triggerClawSlashVisual() {
        clawSlashLayer.classList.remove('active');
        chassis.classList.remove('shake');
        // Force reflow so 0.3s SVG slash animation replays cleanly every time
        void clawSlashLayer.offsetWidth;
        clawSlashLayer.classList.add('active');
        chassis.classList.add('shake');
        playClawSlashSfx();

        setTimeout(() => {
          clawSlashLayer.classList.remove('active');
          chassis.classList.remove('shake');
        }, 420);
      }

      function setState(newState, { autoSequence = false, fileName = null } = {}) {
        clearSequenceTimers();
        currentState = newState;
        chassis.setAttribute('data-state', newState);
        chassis.classList.toggle('drag-active', newState === 'drag');

        // Update Hardware Deck Buttons
        deckBtns.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.target === newState);
        });

        // Update Editorial Speech Bubble & Telemetry
        const meta = STATE_META[newState];
        telemetryMode.textContent = meta.telemetry;
        speechText.textContent =
          newState === 'hack' && fileName
            ? `shredding "${fileName}" meowww ⚡`
            : meta.speech;
        speechSub.textContent = meta.sub;

        speechPill.classList.remove('pop');
        void speechPill.offsetWidth;
        speechPill.classList.add('pop');
        setTimeout(() => speechPill.classList.remove('pop'), 320);

        // State-Specific Effects
        if (newState === 'hack') {
          triggerClawSlashVisual();
          hackTypeInterval = setInterval(playKeyClickSfx, 95);

          if (autoSequence) {
            // Automatically transition from Hack -> Report Delivery -> Chill Coffee Sip
            const t1 = setTimeout(() => {
              setState('report', { autoSequence: true });
            }, 2400);
            sequenceTimers.push(t1);
          }
        } else if (newState === 'report') {
          playReportChimeSfx();
          if (autoSequence) {
            const t2 = setTimeout(() => {
              setState('chill');
            }, 3400);
            sequenceTimers.push(t2);
          }
        }
      }

      // Bind Deck Buttons
      deckBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.target;
          // If user clicks "FILE DROP", run the full choreographed pipeline
          setState(target, { autoSequence: target === 'hack' });
        });
      });

      // Clicking the delivered report envelope transitions to Chill Reading mode
      propEnvelope.addEventListener('click', (e) => {
        e.stopPropagation();
        setState('chill');
      });

      // Clicking viewport in idle state allows picking a file or previewing drop
      dropzone.addEventListener('click', () => {
        if (currentState === 'idle') {
          fileInput.click();
        }
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          const file = e.target.files[0];
          setState('hack', { autoSequence: true, fileName: file.name });
          fileInput.value = '';
        }
      });

      // =====================================================
      // 5. WINDOW-WIDE DRAG & DROP INTERACTION
      // =====================================================
      let dragDepth = 0;

      window.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragDepth++;
        if (currentState !== 'drag') {
          setState('drag');
        }
      });

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      });

      window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0 && currentState === 'drag') {
          setState('idle');
        }
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragDepth = 0;
        const droppedFile =
          e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]
            ? e.dataTransfer.files[0].name
            : 'payload.bin';
        setState('hack', { autoSequence: true, fileName: droppedFile });
      });

      // Keyboard Shortcuts [1-5] for rapid state testing
      window.addEventListener('keydown', (e) => {
        const keyMap = { '1': 'idle', '2': 'drag', '3': 'hack', '4': 'report', '5': 'chill' };
        if (keyMap[e.key]) {
          const target = keyMap[e.key];
          setState(target, { autoSequence: target === 'hack' });
        }
      });
    })();
  </script>
</body>
</html>
