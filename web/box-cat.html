<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLOP-DEPS // BOX CAT SENTINEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-oled: #08090C;
      --bg-card: #0E1016;
      --bg-panel: #13161F;
      --border-dim: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(255, 255, 255, 0.22);
      --cream: #F5F4F0;
      --box-cardboard: #C49A6C;
      --box-cardboard-dark: #A57C4F;
      --box-cardboard-shadow: #835E35;
      --cat-ginger: #E89E5B;
      --cat-white: #FFFFFF;
      --cyan: #00F5D4;
      --emerald: #10B981;
      --crimson: #FF3366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-oled);
      color: var(--cream);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 245, 212, 0.04) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }

    .hud-frame {
      width: 100%;
      max-width: 580px;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-telemetry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
    }

    .tele-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .audio-btn {
      background: #181B26;
      border: 1px solid #2B3045;
      color: var(--cream);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .audio-btn:hover { border-color: var(--cyan); }

    /* Mascot Stage Viewport */
    .viewport {
      position: relative;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    /* Screen Shake & Claw Slash */
    @keyframes screenImpact {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-14px, 8px) rotate(-1.5deg); }
      40% { transform: translate(12px, -10px) rotate(1.5deg); }
      60% { transform: translate(-8px, 6px); }
      80% { transform: translate(6px, -4px); }
      100% { transform: translate(0, 0); }
    }
    .claw-shake { animation: screenImpact 0.35s ease-out; }

    /* SVG Animations */
    #cat-svg * { transform-box: fill-box; }

    /* Idle Cat Breathing */
    @keyframes catBreathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .cat-head-group {
      animation: catBreathe 3.5s ease-in-out infinite;
      transform-origin: bottom center;
    }

    /* Phatak Phatak Typing */
    @keyframes phatakLeft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px) rotate(8deg); }
    }
    @keyframes phatakRight {
      0%, 100% { transform: translateY(-16px) rotate(-8deg); }
      50% { transform: translateY(0); }
    }

    .state-hacking .paw-left-active { animation: phatakLeft 0.1s infinite; }
    .state-hacking .paw-right-active { animation: phatakRight 0.1s infinite; }
    .state-hacking .keycaps-glow { animation: keyGlow 0.2s infinite alternate; }

    @keyframes keyGlow {
      from { fill: var(--cyan); }
      to { fill: #FF8533; }
    }

    /* Claw Slash Tear */
    .slash-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
    }
    @keyframes slashRip {
      0% { stroke-dashoffset: 600; opacity: 1; stroke-width: 12; }
      50% { stroke-dashoffset: 0; opacity: 1; stroke-width: 14; }
      100% { stroke-dashoffset: -600; opacity: 0; stroke-width: 2; }
    }
    .slash-active .slash-1 { animation: slashRip 0.3s forwards; }
    .slash-active .slash-2 { animation: slashRip 0.3s 0.04s forwards; }
    .slash-active .slash-3 { animation: slashRip 0.3s 0.08s forwards; }

    /* Coffee Steam */
    @keyframes steamFloat {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-24px); opacity: 0; }
    }
    .steam-wisp { animation: steamFloat 2s infinite ease-out; }
    .sw-2 { animation-delay: 0.6s; }
    .sw-3 { animation-delay: 1.2s; }

    /* Speech Readout */
    .speech-box {
      background: #12141D;
      border: 1px solid var(--border-dim);
      border-radius: 16px;
      padding: 0.85rem 1.25rem;
      margin: 0 1.5rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .speech-badge {
      background: var(--cyan);
      color: #08090C;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .speech-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--cream);
    }

    /* Bottom Controller Buttons */
    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-dim);
    }

    .btn {
      background: #181B26;
      border: 1px solid #2B3045;
      color: var(--cream);
      padding: 0.6rem 0.4rem;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #232738;
      border-color: var(--border-bright);
      transform: translateY(-1px);
    }
    .btn.active {
      border-color: var(--cyan);
      background: #17222B;
      color: var(--cyan);
    }
  </style>
</head>
<body>

  <div class="hud-frame" id="hudFrame">
    <!-- Top Telemetry -->
    <header class="top-telemetry">
      <div class="tele-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="telemetryLabel" style="color: var(--cyan);">SLOP-DEPS // SENTINEL</span>
      </div>
      <button class="audio-btn" id="audioToggle">SFX: ON</button>
    </header>

    <!-- Mascot Stage Viewport -->
    <div class="viewport" id="viewport">
      <svg id="cat-svg" viewBox="0 0 400 320" width="100%" height="100%">

          <polygon points="254,132 258,92 222,114" fill="#FFA5A5" />

          <!-- Calico / Orange Top Patch -->
          <path d="M 130 138 C 130 105, 150 98, 175 98 C 190 98, 195 125, 205 125 C 215 125, 220 98, 235 98 C 255 98, 270 110, 270 138 C 250 148, 245 132, 235 132 C 220 132, 215 152, 190 152 C 165 152, 150 136, 130 138 Z" fill="#E89E5B" />

          <!-- Cute Cheeks Blush -->

          </g>

          <!-- Little Inverted Triangle Nose & ':3' Mouth -->

             3. CARDBOARD BOX (Front Walls & Rim)

          <!-- Box Shading Side -->
          <polygon points="200,180 290,180 280,268 200,268" fill="#B38758" />

          <!-- Tape / Label on Box -->
          <rect x="155" y="212" width="90" height="26" rx="4" fill="#E8DFD1" stroke="#181A24" stroke-width="2" />
          <text x="200" y="229" fill="#181A24" font-family="JetBrains Mono" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="1">SLOP-BOX</text>

          <!-- Left & Right Dropdown Side Flaps -->
          <polygon points="110,180 82,198 100,230 114,198" fill="#A57C4F" stroke="#181A24" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="290,180 318,198 300,230 286,198" fill="#835E35" stroke="#181A24" stroke-width="3" stroke-linejoin="round"/>
        </g>

        <!-- ==========================================
             4. CUTE ROUND PAWS (Resting on Box Rim)
             ========================================== -->
        <g id="paws-resting">
          <!-- Left Paw -->
          <g id="paw-l-rest">
            <ellipse cx="160" cy="184" rx="14" ry="12" fill="#FFFFFF" stroke="#181A24" stroke-width="3" />
            <line x1="156" y1="184" x2="156" y2="192" stroke="#181A24" stroke-width="2" stroke-linecap="round" />
            <line x1="164" y1="184" x2="164" y2="192" stroke="#181A24" stroke-width="2" stroke-linecap="round" />

          <!-- Right Paw -->
          <g id="paw-r-rest">
            <ellipse cx="240" cy="184" rx="14" ry="12" fill="#FFFFFF" stroke="#181A24" stroke-width="3" />

            <line x1="244" y1="184" x2="244" y2="192" stroke="#181A24" stroke-width="2" stroke-linecap="round" />

            <rect x="136" y="226" width="12" height="10" rx="2" />
            <rect x="152" y="226" width="12" height="10" rx="2" />
            <rect x="168" y="226" width="12" height="10" rx="2" />
            <rect x="184" y="226" width="12" height="10" rx="2" />
            <rect x="200" y="226" width="12" height="10" rx="2" />
            <rect x="216" y="226" width="12" height="10" rx="2" />
            <rect x="232" y="226" width="12" height="10" rx="2" />
            <rect x="248" y="226" width="12" height="10" rx="2" />
            <rect x="264" y="226" width="16" height="10" rx="2" fill="#FF3366" />

            <!-- Row 2 -->
            <rect x="124" y="240" width="18" height="10" rx="2" />
            <rect x="146" y="240" width="108" height="10" rx="2" fill="#E89E5B" />

          <!-- Both Paws Holding Mug -->

             7. REPORT ENVELOPE (State: Report)
             ========================================== -->

             8. CLAW SLASH TEAR OVERLAY (0.3s)
             ========================================== -->

          <path class="slash-line slash-2" d="M 80 20 L 200 120 L 320 220 L 390 280" stroke="#FFFFFF" stroke-linecap="round" fill="none" />

    <!-- Speech Readout -->

    <!-- Control Buttons -->

      <button class="btn active" data-state="idle">01. IDLE</button>
      <button class="btn" data-state="drag">02. DRAG</button>
      <button class="btn" data-state="hacking">03. PHATAK!</button>
      <button class="btn" data-state="chill">04. COFFEE</button>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer for tactile feedback
    class Synth {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.loop = null;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playClick(freq = 600) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.03);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.035);
      }
      playClawSlash() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.25, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.08));
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const flt = this.ctx.createBiquadFilter();
        flt.type = 'bandpass';
        flt.frequency.setValueAtTime(2200, now);
        flt.frequency.exponentialRampToValueAtTime(400, now + 0.24);
        src.connect(flt);
        flt.connect(this.ctx.destination);
        src.start(now);
      }
      startPhatakLoop() {
        this.stopPhatakLoop();
        this.loop = setInterval(() => {
          this.playClick(400 + Math.random() * 400);
        }, 90);
      }
      stopPhatakLoop() {
        if (this.loop) { clearInterval(this.loop); this.loop = null; }
      }
    }

    const synth = new Synth();

    // Elements
    const hudFrame = document.getElementById('hudFrame');
    const viewport = document.getElementById('viewport');
    const catSvg = document.getElementById('cat-svg');
    const pawsResting = document.getElementById('paws-resting');
    const hackingProps = document.getElementById('hacking-mode-props');
    const coffeeProps = document.getElementById('coffee-mode-props');
    const envelopeProps = document.getElementById('envelope-mode-props');
    const clawOverlay = document.getElementById('claw-overlay');
    const speechBadge = document.getElementById('speechBadge');
    const speechText = document.getElementById('speechText');
    const statusDot = document.getElementById('statusDot');
    const telemetryLabel = document.getElementById('telemetryLabel');
    const audioToggle = document.getElementById('audioToggle');

    // Eyes tracking elements
    const eyeL = document.getElementById('eye-left');
    const eyeR = document.getElementById('eye-right');
    const glintL = document.getElementById('glint-left');
    const glintR = document.getElementById('glint-right');

    let currentState = 'idle';

    // Mouse Tracking (Trigonometric Eye Pupils)
    window.addEventListener('mousemove', (e) => {
      const rect = catSvg.getBoundingClientRect();
      const catCenterX = rect.left + rect.width / 2;
      const catCenterY = rect.top + rect.height * 0.45;
      
      const dx = e.clientX - catCenterX;
      const dy = e.clientY - catCenterY;
      const angle = Math.atan2(dy, dx);
      const dist = Math.min(4.5, Math.hypot(dx, dy) * 0.02);

      const offsetX = Math.cos(angle) * dist;
      const offsetY = Math.sin(angle) * dist;

      if (currentState !== 'hacking') {
        eyeL.setAttribute('cx', 168 + offsetX);
        eyeL.setAttribute('cy', 148 + offsetY);
        glintL.setAttribute('cx', 166 + offsetX);
        glintL.setAttribute('cy', 145 + offsetY);

        eyeR.setAttribute('cx', 232 + offsetX);
        eyeR.setAttribute('cy', 148 + offsetY);
        glintR.setAttribute('cx', 230 + offsetX);
        glintR.setAttribute('cy', 145 + offsetY);
      }
    });

    function setState(st) {
      currentState = st;
      synth.stopPhatakLoop();

      // Reset buttons
      document.querySelectorAll('.btn').forEach(b => b.classList.toggle('active', b.dataset.state === st));

      // Reset visibility
      pawsResting.style.display = 'block';
      hackingProps.style.display = 'none';
      coffeeProps.style.display = 'none';
      envelopeProps.style.display = 'none';
      catSvg.classList.remove('state-hacking');

      switch (st) {
        case 'idle':
          telemetryLabel.textContent = 'SLOP-DEPS // SENTINEL';
          telemetryLabel.style.color = 'var(--cyan)';
          statusDot.style.background = 'var(--cyan)';
          speechBadge.textContent = 'IDLE';
          speechBadge.style.background = 'var(--cyan)';
          speechText.textContent = 'meowww give me ur files meowww';
          synth.playClick(650);
          break;

        case 'drag':
          telemetryLabel.textContent = 'TARGET LOCKED // DROP TO SCAN';
          telemetryLabel.style.color = '#FF8533';
          statusDot.style.background = '#FF8533';
          speechBadge.textContent = 'LOCKED';
          speechBadge.style.background = '#FF8533';
          speechText.textContent = 'O_O DROP IT IN THE BOX MEOWWW!!';
          synth.playClick(850);
          break;

        case 'hacking':
          synth.playClawSlash();
          viewport.classList.add('claw-shake');
          clawOverlay.classList.add('slash-active');
          setTimeout(() => {
            viewport.classList.remove('claw-shake');
            clawOverlay.classList.remove('slash-active');
          }, 350);

          pawsResting.style.display = 'none';
          hackingProps.style.display = 'block';
          catSvg.classList.add('state-hacking');

          telemetryLabel.textContent = 'HACKING // PARSING DEPENDENCIES';
          telemetryLabel.style.color = 'var(--crimson)';
          statusDot.style.background = 'var(--crimson)';
          speechBadge.textContent = 'PHATAK!';
          speechBadge.style.background = 'var(--crimson)';
          speechText.textContent = '*phatak-phatak-phatak* scanning AST tree...';
          synth.startPhatakLoop();
          break;

        case 'chill':
          pawsResting.style.display = 'none';
          coffeeProps.style.display = 'block';

          telemetryLabel.textContent = 'SECURED // ZERO SLOP DETECTED';
          telemetryLabel.style.color = 'var(--emerald)';
          statusDot.style.background = 'var(--emerald)';
          speechBadge.textContent = 'CHILL ☕';
          speechBadge.style.background = 'var(--emerald)';
          speechText.textContent = '*sippp* clean repo! zero hallucinations ☕';
          synth.playClick(500);
          break;
      }
    }

    // Button Clicks
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', () => setState(btn.dataset.state));
    });

    // Drag and Drop Simulator on Stage
    viewport.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (currentState !== 'drag') setState('drag');
    });

    viewport.addEventListener('dragleave', (e) => {
      e.preventDefault();
      if (currentState === 'drag') setState('idle');
    });

    viewport.addEventListener('drop', (e) => {
      e.preventDefault();
      setState('hacking');
      setTimeout(() => {
        setState('chill');
      }, 3500);
    });

    // Click to cycle
    viewport.addEventListener('click', () => {
      if (currentState === 'idle') setState('hacking');
      else if (currentState === 'hacking') setState('chill');
      else setState('idle');
    });

    // Audio toggle
    audioToggle.addEventListener('click', () => {
      synth.enabled = !synth.enabled;
      audioToggle.textContent = synth.enabled ? 'SFX: ON' : 'SFX: OFF';
      audioToggle.style.color = synth.enabled ? 'var(--cyan)' : '#888';
    });
  </script>
</body>
</html>
